  <rect x="155" y="380" width="520" height="120" rx="12" fill="#e9f6f2" stroke="#72b5a5" />
  <text x="415.0" y="419.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#155e55" text-anchor="middle" font-weight="700">输入当前事实 + 实际执行状态 + 最近反馈</text>
  <text x="415.0" y="446.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#155e55" text-anchor="middle">模型选择下一步候选动作</text>
  <text x="415.0" y="473.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#155e55" text-anchor="middle">保存原始 choice、耗时与请求快照</text>
