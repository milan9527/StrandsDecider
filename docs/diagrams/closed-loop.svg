  <text x="800.0" y="1286.65" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#855116" text-anchor="middle">自动模拟确认、补款、地址验证、审批、结算；风险需手动解除</text>
  <text x="800.0" y="1315.15" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#855116" text-anchor="middle">模拟事件 ≠ 模型执行交易；客服回复来自模板；无真实资金操作</text>
  <rect x="100" y="1370" width="1400" height="70" rx="12" fill="#f2f5f8" stroke="#c5cfda" />
