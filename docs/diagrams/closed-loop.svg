  <text x="800.0" y="1423.7" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#52677c" text-anchor="middle">生产环境还需持久化工作流、权限校验、条件写与数据库级幂等。</text>
