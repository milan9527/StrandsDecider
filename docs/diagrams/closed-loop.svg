  <text x="56" y="58.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="30" fill="#1c3045" text-anchor="start" font-weight="700">04  自主闭环：根据实际执行结果继续判断</text>
  <text x="56" y="104.6" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#1c3045" text-anchor="start" font-weight="700">两侧从同一初始证据开始，分别维护工作流。每轮展示输入、选择、实际动作与反馈；同轮编号不代表相同输入。</text>
  <rect x="390" y="145" width="820" height="95" rx="12" fill="#f2f5f8" stroke="#c5cfda" />
  <text x="800.0" y="184.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#52677c" text-anchor="middle" font-weight="700">同一初始场景 / 客户诉求</text>
  <text x="800.0" y="214.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#52677c" text-anchor="middle">相同候选、执行保护、预算与模拟事件规则</text>
