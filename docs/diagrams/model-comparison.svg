  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="56" y="58.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="30" fill="#1c3045" text-anchor="start" font-weight="700">02  Decider vs 普通大模型：本演示的实际调用流程</text>
  <text x="56" y="104.6" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#1c3045" text-anchor="start" font-weight="700">固定输入模式：同一步相同业务 payload；普通大模型也限定返回候选 ID。自主闭环中，后续输入可因执行结果而不同。</text>
  <rect x="340" y="140" width="920" height="95" rx="12" fill="#ffffff" stroke="#b9c8d5" />
  <text x="800.0" y="180.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#1c3045" text-anchor="middle" font-weight="700">应用准备输入（候选项由开发者提供）</text>
  <text x="800.0" y="207.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#1c3045" text-anchor="middle">同一业务事实 state + 问题 instructions + 候选项 criteria → 相同 input_hash</text>
  <rect x="60" y="285" width="710" height="655" rx="12" fill="#e9f6f2" stroke="#72b5a5" stroke-dasharray="7 5" />
  <text x="76" y="315.0" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#155e55" text-anchor="start" font-weight="700">A  Strands Decider · 专用决策模型</text>
  <rect x="830" y="285" width="710" height="655" rx="12" fill="#edf2ff" stroke="#9aaedf" stroke-dasharray="7 5" />
  <text x="846" y="315.0" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#3159ac" text-anchor="start" font-weight="700">B  普通生成式大模型 · Bedrock GPT-6.1 Sol</text>
  <rect x="130" y="350" width="570" height="85" rx="12" fill="#e9f6f2" stroke="#72b5a5" />
  <text x="415.0" y="385.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#155e55" text-anchor="middle" font-weight="700">应用构造 choice 请求</text>
  <text x="415.0" y="412.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#155e55" text-anchor="middle">给定业务事实与候选动作，要求选一项</text>
  <rect x="900" y="350" width="570" height="85" rx="12" fill="#edf2ff" stroke="#9aaedf" />
  <text x="1185.0" y="385.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#3159ac" text-anchor="middle" font-weight="700">应用构造 Converse 请求</text>
  <text x="1185.0" y="412.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#3159ac" text-anchor="middle">相同业务 payload + 仅输出候选 ID JSON 的要求</text>
  <rect x="130" y="490" width="570" height="110" rx="12" fill="#e9f6f2" stroke="#72b5a5" />
  <text x="415.0" y="524.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#155e55" text-anchor="middle" font-weight="700">私网 HTTP → ECS on EC2 / Decider v19</text>
  <text x="415.0" y="551.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#155e55" text-anchor="middle">官方 System One 模型服务 / L4 GPU</text>
  <text x="415.0" y="578.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#155e55" text-anchor="middle">GPU 租约与串行推理；独立测量每步</text>
  <rect x="900" y="490" width="570" height="110" rx="12" fill="#edf2ff" stroke="#9aaedf" />
  <text x="1185.0" y="524.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#3159ac" text-anchor="middle" font-weight="700">Bedrock Converse → GPT-6.1 Sol</text>
  <text x="1185.0" y="551.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#3159ac" text-anchor="middle">reasoning effort = low / maxTokens = 1024</text>
  <text x="1185.0" y="578.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#3159ac" text-anchor="middle">生成文本形式的决策 JSON</text>
  <rect x="130" y="655" width="570" height="100" rx="12" fill="#e9f6f2" stroke="#72b5a5" />
  <text x="415.0" y="684.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#155e55" text-anchor="middle" font-weight="700">读取结构化模型响应</text>
  <text x="415.0" y="711.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#155e55" text-anchor="middle">choice + probabilities + confidence</text>
  <text x="415.0" y="738.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#155e55" text-anchor="middle">验证候选 ID、分布与响应字段</text>
  <rect x="900" y="655" width="570" height="100" rx="12" fill="#edf2ff" stroke="#9aaedf" />
  <text x="1185.0" y="684.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#3159ac" text-anchor="middle" font-weight="700">解析生成的 JSON 并验证</text>
  <text x="1185.0" y="711.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#3159ac" text-anchor="middle">仅允许 choice，且必须属于候选列表</text>
  <text x="1185.0" y="738.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#3159ac" text-anchor="middle">记录输入/输出 tokens，不伪造概率</text>
  <rect x="130" y="815" width="570" height="85" rx="12" fill="#e9f6f2" stroke="#72b5a5" />
  <text x="415.0" y="850.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#155e55" text-anchor="middle" font-weight="700">保留原始选择与概率</text>
  <text x="415.0" y="877.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#155e55" text-anchor="middle">记录每步耗时；GPU 按运行时间计费</text>
  <rect x="900" y="815" width="570" height="85" rx="12" fill="#edf2ff" stroke="#9aaedf" />
  <text x="1185.0" y="850.7" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#3159ac" text-anchor="middle" font-weight="700">保留原始选择与 token 使用量</text>
  <text x="1185.0" y="876.2" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#3159ac" text-anchor="middle">记录每步耗时；未核实单价，不估算美元成本</text>
  <rect x="320" y="995" width="960" height="125" rx="12" fill="#fff5e7" stroke="#ddb775" />
  <text x="800.0" y="1036.8" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#855116" text-anchor="middle" font-weight="700">相同的应用执行策略 · 两侧各有独立沙盒状态</text>
  <text x="800.0" y="1063.8" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#855116" text-anchor="middle">参考选择不同 → 仅提示，继续流程</text>
  <text x="800.0" y="1090.8" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#855116" text-anchor="middle">资金/结案条件不足 → 挂起或持续跟进，记录保护调整并继续</text>
  <rect x="320" y="1170" width="960" height="100" rx="12" fill="#ffffff" stroke="#b9c8d5" />
  <text x="800.0" y="1200.45" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#1c3045" text-anchor="middle" font-weight="700">最终结果：五步执行记录 + 订单/工单状态 + 模拟账本 + 模板客服回复</text>
  <text x="800.0" y="1225.95" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#1c3045" text-anchor="middle">对比：同输入动作、参考一致、保护调整、每步/合计时间</text>
  <text x="800.0" y="1251.45" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#1c3045" text-anchor="middle">真实请求失败明确显示；不会用规则回放替代模型输出</text>
  <text x="71" y="1302.75" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#1c3045" text-anchor="start" font-weight="700">范围：客服文字理解与动作选择；不比较自由长文本生成、不调用真实交易工具。后端保护调整不会计作模型正确输出。</text>
