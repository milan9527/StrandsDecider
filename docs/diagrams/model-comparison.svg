  <text x="290.0" y="875.1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#155e55" text-anchor="middle">GPU 按运行时间计费</text>
  <rect x="565" y="285" width="470" height="655" rx="12" fill="#faf5ff" stroke="#ba9cdb" stroke-dasharray="7 5" />
  <text x="581" y="315.0" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#8056b3" text-anchor="start" font-weight="700">Jev · Typesafe 托管 API</text>
  <rect x="605" y="350" width="390" height="85" rx="12" fill="#faf5ff" stroke="#ba9cdb" />
  <text x="800.0" y="386.1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8056b3" text-anchor="middle" font-weight="700">相同 System One choice 请求</text>
  <text x="800.0" y="410.1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8056b3" text-anchor="middle">业务事实 + 问题 + 候选条件</text>
  <rect x="605" y="490" width="390" height="110" rx="12" fill="#faf5ff" stroke="#ba9cdb" />
  <text x="800.0" y="526.6" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8056b3" text-anchor="middle" font-weight="700">ECS → IAM Lambda → Jev HTTPS</text>
  <text x="800.0" y="550.6" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8056b3" text-anchor="middle">服务端密钥 / jev-latest</text>
  <text x="800.0" y="574.6" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8056b3" text-anchor="middle">保留实际返回的模型版本</text>
  <rect x="605" y="655" width="390" height="100" rx="12" fill="#faf5ff" stroke="#ba9cdb" />
  <text x="800.0" y="698.6" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8056b3" text-anchor="middle" font-weight="700">choice + probabilities + confidence</text>
  <text x="800.0" y="722.6" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8056b3" text-anchor="middle">保留 token，不混同概率校准尺度</text>
  <rect x="605" y="815" width="390" height="85" rx="12" fill="#faf5ff" stroke="#ba9cdb" />
  <text x="800.0" y="851.1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8056b3" text-anchor="middle" font-weight="700">后端耗时含 Lambda 与 HTTPS 往返</text>
  <text x="800.0" y="875.1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8056b3" text-anchor="middle">未报告纯推理时间则保留为空</text>
