  <text x="1310.0" y="851.1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#3159ac" text-anchor="middle" font-weight="700">每步耗时与成功决策累计时间</text>
  <text x="1310.0" y="875.1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#3159ac" text-anchor="middle">未核实单价，不估算美元成本</text>
  <rect x="320" y="995" width="960" height="125" rx="12" fill="#fff5e7" stroke="#ddb775" />
  <text x="800.0" y="1036.8" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#855116" text-anchor="middle" font-weight="700">相同执行保护 · 三个模型各有独立沙盒状态</text>
  <text x="800.0" y="1063.8" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#855116" text-anchor="middle">参考差异仅提示，继续流程；资金／结案条件不足时挂起或跟进</text>
  <text x="800.0" y="1090.8" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#855116" text-anchor="middle">原始模型选择、实际动作及保护调整分别保留</text>
  <rect x="320" y="1170" width="960" height="100" rx="12" fill="#ffffff" stroke="#b9c8d5" />
  <text x="800.0" y="1200.45" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#1c3045" text-anchor="middle" font-weight="700">三列结果：逐轮输入输出 + 每步耗时 + 实际执行 + 最终订单／工单／模拟账本</text>
  <text x="800.0" y="1225.95" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#1c3045" text-anchor="middle">一个模型失败，其他模型仍可完成；失败不计作零耗时成功</text>
  <text x="800.0" y="1251.45" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#1c3045" text-anchor="middle">相对 Decider 的耗时倍数只使用对应模型同输入且成功的步骤</text>
