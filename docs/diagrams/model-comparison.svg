  <text x="56" y="58.5" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="30" fill="#1c3045" text-anchor="start" font-weight="700">02  Strands Decider vs Jev vs GPT：同一输入，三条决策路径</text>
  <text x="56" y="104.6" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#1c3045" text-anchor="start" font-weight="700">固定／优化流程每步并发调用三个模型；闭环各自读取执行反馈，后续输入可能不同。</text>
  <rect x="340" y="140" width="920" height="95" rx="12" fill="#ffffff" stroke="#b9c8d5" />
  <text x="800.0" y="180.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#1c3045" text-anchor="middle" font-weight="700">应用准备相同输入（候选项由开发者提供）</text>
  <text x="800.0" y="207.3" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#1c3045" text-anchor="middle">业务事实 state + 问题 instructions + 候选项 criteria → 相同 input_hash</text>
