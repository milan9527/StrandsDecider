  <text x="1310.0" y="698.6" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#3159ac" text-anchor="middle" font-weight="700">解析 JSON，校验 choice 属于候选</text>
  <text x="1310.0" y="722.6" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#3159ac" text-anchor="middle">记录 token，不伪造候选概率</text>
