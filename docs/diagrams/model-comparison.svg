  <text x="1310.0" y="386.1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#3159ac" text-anchor="middle" font-weight="700">Converse 请求使用相同业务输入</text>
  <text x="1310.0" y="410.1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#3159ac" text-anchor="middle">要求仅返回候选 ID JSON</text>
  <rect x="1115" y="490" width="390" height="110" rx="12" fill="#edf2ff" stroke="#9aaedf" />
  <text x="1310.0" y="526.6" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#3159ac" text-anchor="middle" font-weight="700">Bedrock Converse → GPT-6.1 Sol</text>
  <text x="1310.0" y="550.6" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#3159ac" text-anchor="middle">reasoning effort = low</text>
  <text x="1310.0" y="574.6" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#3159ac" text-anchor="middle">生成文本形式的决策 JSON</text>
