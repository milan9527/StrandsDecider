  <text x="1091" y="315.0" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#3159ac" text-anchor="start" font-weight="700">GPT-6.1 Sol · Bedrock</text>
