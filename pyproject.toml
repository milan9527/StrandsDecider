[project]
name = "strands-decider-demo"
version = "0.1.0"
description = "A Chinese interactive playground for Strands Decider."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
model = [
    "strands-decider @ https://github.com/strands-labs/strands-decider/archive/63d24ae286e50105fba0bd1db15b0e243aea4650.tar.gz",
    "torch==2.7.1",
    "transformers==5.17.0",
    "peft==0.21.0",
]
dev = [
    "moto[dynamodb]>=5,<6",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
